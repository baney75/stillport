name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify release version
        run: test "v$(bun src/cli.ts --version)" = "$GITHUB_REF_NAME"
      - run: bun run check
      - run: bun scripts/build.ts --all
      - name: Smoke test Linux release
        run: |
          chmod +x dist/stillport-linux-x64
          dist/stillport-linux-x64 --version
          dist/stillport-linux-x64 capabilities
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Stillport $GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag
