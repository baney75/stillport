name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify release version
        run: test "v$(bun src/cli.ts --version)" = "$GITHUB_REF_NAME"
      - run: bun run check
      - run: bun scripts/build.ts --all
      - run: bun run package:plugin
      - name: Smoke test Linux release
        run: |
          chmod +x dist/stillport-linux-x64
          dist/stillport-linux-x64 --version
          dist/stillport-linux-x64 capabilities
      - uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/*
  windows-smoke:
    needs: build
    strategy:
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist
      - name: Verify native release asset
        shell: pwsh
        run: |
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          $asset = "stillport-windows-$arch.exe"
          $line = @(Get-Content dist/SHA256SUMS | Where-Object { $_ -match ('^[a-f0-9]{64}  ' + [regex]::Escape($asset) + '$') })
          if ($line.Count -ne 1) { throw 'Release checksum is missing or ambiguous.' }
          if ((Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $line[0].Substring(0,64)) { throw 'Release checksum mismatch.' }
          $env:STILLPORT_WINDOWS_BINARY = (Resolve-Path "dist/$asset").Path
          & $env:STILLPORT_WINDOWS_BINARY --version
          if ($LASTEXITCODE -ne 0) { throw 'Native version check failed.' }
          & $env:STILLPORT_WINDOWS_BINARY capabilities
          if ($LASTEXITCODE -ne 0) { throw 'Native capabilities failed.' }
          $env:STILLPORT_BIN = $env:STILLPORT_WINDOWS_BINARY
          & "$PWD/examples/takeout-demo/run.ps1" "$PWD/.local/release-demo"
          bun test tests/windows.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows tests failed.' }
  publish:
    needs: [build, windows-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Stillport $GITHUB_REF_NAME" --notes-file docs/release-notes.md --verify-tag
