name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - run: bun run build
      - name: Smoke test standalone binary
        run: |
          chmod +x dist/stillport-*
          dist/stillport-* --version
          dist/stillport-* doctor
          dist/stillport-* capabilities
      - run: sh -n install.sh
      - run: bun run package:plugin
      - name: Exercise the extracted plugin fixture
        run: |
          unzip -q dist/stillport-plugin-*.zip -d .local/plugin-smoke
          for binary in "$PWD"/dist/stillport-*; do
            case "$binary" in *.zip|*.sha256) continue ;; esac
            STILLPORT_BIN="$binary" sh .local/plugin-smoke/examples/takeout-demo/run.sh .local/plugin-output
          done
